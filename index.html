<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Что делает робот за Иру</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#FF2026;--white:#FFFFFF;--cream:#E8E5DE;--black:#000000;--graphite:#191919}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--black);color:var(--white);font-family:Manrope,Arial,sans-serif}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:440px;text-align:center}
.gate-emoji{font-size:64px;line-height:1;margin-bottom:24px}
.gate h1{font-family:"Russo One",Arial,sans-serif;font-weight:400;font-size:clamp(24px,5vw,32px);line-height:1.2;margin-bottom:32px}
.gate input{width:100%;padding:18px 20px;font:700 18px Manrope,Arial,sans-serif;background:var(--graphite);color:var(--white);border:2px solid var(--graphite);border-radius:14px;text-align:center;outline:none}
.gate input:focus{border-color:var(--red)}
.gate button{width:100%;margin-top:12px;padding:18px;font:700 18px Manrope,Arial,sans-serif;background:var(--red);color:var(--white);border:0;border-radius:14px;cursor:pointer}
.gate button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.err{min-height:24px;margin-top:14px;color:var(--red);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.result{display:none;min-height:100vh;background:var(--cream);color:var(--black);padding:48px 24px}
.result.on{display:block}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:56px;align-items:center}
.photo img{display:block;width:100%;height:auto;border-radius:20px;border:6px solid var(--black)}
.verdict{font-family:"Russo One",Arial,sans-serif;font-weight:400;text-transform:uppercase;line-height:.98;color:var(--red)}
.verdict .big{display:block;font-size:clamp(64px,11vw,160px)}
.verdict .rest{display:block;margin-top:24px;font-size:clamp(28px,4.2vw,58px);color:var(--black);line-height:1.08}
@media (max-width:800px){.wrap{grid-template-columns:1fr;gap:32px}.photo{max-width:420px;margin:0 auto}.verdict{text-align:center}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>

  <form class="gate-box" id="form" autocomplete="off">
    <div class="gate-emoji" aria-hidden="true">🤖</div>
    <h1>Введите пароль, чтобы увидеть, какую работу выполняет за Иру робот</h1>
    <input id="pwd" type="password" placeholder="Пароль" aria-label="Пароль" autofocus>
    <button type="submit">Посмотреть</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  var p=document.getElementById('pwd'),box=this;
  if(p.value.trim()==='IraRobot'){
    document.getElementById('gate').style.display='none';
    document.getElementById('result').classList.add('on');

});
